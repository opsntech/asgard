{% extends "base.html" %}

{% block title %}Sessions - SSH Session Monitor{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <h2><i class="bi bi-person-lines-fill"></i> Sessions</h2>
    </div>
</div>

<!-- Filters -->
<div class="row mb-4">
    <div class="col-12">
        <div class="card">
            <div class="card-body">
                <form id="filter-form" class="row g-3">
                    <div class="col-md-2">
                        <label class="form-label">Environment</label>
                        <select class="form-select" id="filter-env">
                            <option value="">All</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control" id="filter-user" placeholder="Search...">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Server</label>
                        <input type="text" class="form-control" id="filter-server" placeholder="Search...">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Status</label>
                        <select class="form-select" id="filter-status">
                            <option value="">All</option>
                            <option value="active">Active Only</option>
                        </select>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary me-2">
                            <i class="bi bi-search"></i> Filter
                        </button>
                        <button type="button" class="btn btn-secondary" onclick="resetFilters()">
                            <i class="bi bi-x-circle"></i> Reset
                        </button>
                    </div>
                    <div class="col-md-2 d-flex align-items-end justify-content-end">
                        <button type="button" class="btn btn-success" onclick="exportCSV()">
                            <i class="bi bi-download"></i> Export CSV
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Sessions Table -->
<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="bi bi-table"></i> Session History</span>
                <span class="text-muted" id="session-count">Loading...</span>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover table-striped">
                        <thead class="table-dark">
                            <tr>
                                <th>Status</th>
                                <th>Environment</th>
                                <th>Server</th>
                                <th>Username</th>
                                <th>Source IP</th>
                                <th>TTY</th>
                                <th>Login Time</th>
                                <th>Logout Time</th>
                                <th>Duration</th>
                            </tr>
                        </thead>
                        <tbody id="sessions-tbody">
                            <tr><td colspan="9" class="text-center">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <nav id="pagination-nav">
                    <ul class="pagination justify-content-center" id="pagination">
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentPage = 0;
const pageSize = 50;

document.addEventListener('DOMContentLoaded', function() {
    loadEnvironments();
    loadSessions();

    document.getElementById('filter-form').addEventListener('submit', function(e) {
        e.preventDefault();
        currentPage = 0;
        loadSessions();
    });
});

async function loadEnvironments() {
    const envs = await fetch('/api/v1/environments').then(r => r.json());
    const select = document.getElementById('filter-env');
    envs.forEach(env => {
        const option = document.createElement('option');
        option.value = env.name;
        option.textContent = env.name;
        select.appendChild(option);
    });
}

async function loadSessions() {
    const params = new URLSearchParams();

    const env = document.getElementById('filter-env').value;
    const user = document.getElementById('filter-user').value;
    const server = document.getElementById('filter-server').value;
    const status = document.getElementById('filter-status').value;

    if (env) params.append('environment', env);
    if (user) params.append('username', user);
    if (server) params.append('server', server);
    if (status === 'active') params.append('active', 'true');

    params.append('limit', pageSize);
    params.append('offset', currentPage * pageSize);

    const data = await fetch(`/api/v1/sessions?${params}`).then(r => r.json());

    document.getElementById('session-count').textContent = `${data.total} total sessions`;

    const tbody = document.getElementById('sessions-tbody');
    if (data.sessions.length > 0) {
        tbody.innerHTML = data.sessions.map(s => `
            <tr>
                <td>
                    ${s.is_active
                        ? '<span class="badge bg-success">Active</span>'
                        : '<span class="badge bg-secondary">Ended</span>'}
                </td>
                <td><span class="badge bg-info">${s.environment || 'Unknown'}</span></td>
                <td>${s.server}</td>
                <td><strong>${s.username}</strong></td>
                <td><code>${s.source_ip}</code></td>
                <td>${s.tty}</td>
                <td>${formatDate(s.login_time)}</td>
                <td>${s.logout_time ? formatDate(s.logout_time) : '-'}</td>
                <td>${s.duration || getDuration(s.login_time)}</td>
            </tr>
        `).join('');
    } else {
        tbody.innerHTML = '<tr><td colspan="9" class="text-center text-muted">No sessions found</td></tr>';
    }

    // Update pagination
    updatePagination(data.total);
}

function updatePagination(total) {
    const totalPages = Math.ceil(total / pageSize);
    const pagination = document.getElementById('pagination');

    let html = '';

    // Previous
    html += `<li class="page-item ${currentPage === 0 ? 'disabled' : ''}">
        <a class="page-link" href="#" onclick="goToPage(${currentPage - 1})">Previous</a>
    </li>`;

    // Page numbers
    for (let i = Math.max(0, currentPage - 2); i < Math.min(totalPages, currentPage + 3); i++) {
        html += `<li class="page-item ${i === currentPage ? 'active' : ''}">
            <a class="page-link" href="#" onclick="goToPage(${i})">${i + 1}</a>
        </li>`;
    }

    // Next
    html += `<li class="page-item ${currentPage >= totalPages - 1 ? 'disabled' : ''}">
        <a class="page-link" href="#" onclick="goToPage(${currentPage + 1})">Next</a>
    </li>`;

    pagination.innerHTML = html;
}

function goToPage(page) {
    currentPage = page;
    loadSessions();
}

function resetFilters() {
    document.getElementById('filter-env').value = '';
    document.getElementById('filter-user').value = '';
    document.getElementById('filter-server').value = '';
    document.getElementById('filter-status').value = '';
    currentPage = 0;
    loadSessions();
}

function exportCSV() {
    const params = new URLSearchParams();
    const env = document.getElementById('filter-env').value;
    const user = document.getElementById('filter-user').value;
    const server = document.getElementById('filter-server').value;
    const status = document.getElementById('filter-status').value;

    if (env) params.append('environment', env);
    if (user) params.append('username', user);
    if (server) params.append('server', server);
    if (status === 'active') params.append('active', 'true');
    params.append('limit', 10000);

    fetch(`/api/v1/sessions?${params}`)
        .then(r => r.json())
        .then(data => {
            let csv = 'Status,Environment,Server,Username,Source IP,TTY,Login Time,Logout Time,Duration\n';
            data.sessions.forEach(s => {
                csv += `${s.is_active ? 'Active' : 'Ended'},${s.environment || ''},${s.server},${s.username},${s.source_ip},${s.tty},${s.login_time},${s.logout_time || ''},${s.duration || ''}\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `ssh-sessions-${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
        });
}
</script>
{% endblock %}
