services:
  db:
    image: postgres:15-alpine
    container_name: ssh-monitor-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sshmonitor
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: sshmonitor
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sshmonitor"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: ssh-monitor-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sshmonitor:${DB_PASSWORD:-changeme}@db:5432/sshmonitor
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      API_KEY: ${API_KEY:-your-secure-api-key}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      SLACK_WEBHOOK: ${SLACK_WEBHOOK:-}
      FLASK_ENV: ${FLASK_ENV:-production}
    ports:
      - "5000:5000"

  nginx:
    image: nginx:alpine
    container_name: ssh-monitor-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    profiles:
      - production

volumes:
  postgres_data:
